services:
  mysql:
    image: mysql:8
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/saloondevdb
    environment:
      MYSQL_DATABASE: saloondevdb
      MYSQL_USER: mathieu
      MYSQL_PASSWORD: chauchau1408
      MYSQL_ROOT_PASSWORD: rootpassword

  spring-app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/saloondevdb
      DB_HOST_DEV: mysql
      DB_PORT_DEV: 3306
      DB_NAME_DEV: saloondevdb
      DB_USER_DEV: mathieu
      DB_PASSWORD_DEV: chauchau1408
      CLIENT_URL_DEV: ${CLIENT_URL_DEV}
      APP_BASE_URL_DEV: ${APP_BASE_URL_DEV}
      JWT_SECRET_KEY_DEV: yourSuperSecureSecretKeyWith32Charsandmoreandmorandmore
      EXPIRATION_TIME: 3600000

volumes:
  db-data:
