spring:
  datasource:
    url: jdbc:mysql://${DB_HOST_DEV}:${DB_PORT_DEV}/${DB_NAME_DEV}?createDatabaseIfNotExist=true
    username: ${DB_USER_DEV}
    password: ${DB_PASSWORD_DEV}
  data:
    redis:
      host: ${REDIS_HOST_DEV:localhost}
      port: ${REDIS_PORT_DEV:6379}
      password: ${REDIS_PASSWORD_DEV:}

springdoc:
  swagger-ui:
    enabled: true

cors:
  allowedOrigins: ${CLIENT_URL_DEV}

logging:
  level:
    com.backend_project_template: DEBUG

app:
  base-url: ${APP_BASE_URL_DEV}
  frontend-url: ${CLIENT_URL_DEV}
