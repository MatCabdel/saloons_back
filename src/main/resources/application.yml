spring:
  profiles:
    active:
      - development
  config:
    import:
      - "configtree:./"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
cors:
  allowedOrigins: "http://localhost:4200,http://localhost"

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${EXPIRATION_TIME}