spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
      enabled: true
  profiles:
    active:
      - development
  config:
    import:
      - "configtree:./"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
cors:
  allowedOrigins: "http://localhost:4200,http://localhost"

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${EXPIRATION_TIME}

firebase:
  credentials:
    file: ${FIREBASE_CREDENTIALS_FILE}

app:
  admin-email: ${ADMIN_EMAIL}
  mail-from: ${MAIL_FROM}
