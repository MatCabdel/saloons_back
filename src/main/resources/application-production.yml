spring:
  datasource:
    url: jdbc:mysql://${DB_HOST_PROD}:${DB_PORT_PROD}/${DB_NAME_PROD}?createDatabaseIfNotExist=true
    username: ${DB_USER_PROD}
    password: ${DB_PASSWORD_PROD}
  data:
    redis:
      host: ${REDIS_HOST_PROD}
      port: ${REDIS_PORT_PROD}

springdoc:
  swagger-ui: 
    enabled: false

cors:
  allowedOrigins: ${CLIENT_URL_PROD},capacitor://localhost,https://localhost

logging:
  level:
    com.backend_project_template: INFO

app:
  base-url: ${APP_BASE_URL_PROD}
  frontend-url: ${CLIENT_URL_PROD}
