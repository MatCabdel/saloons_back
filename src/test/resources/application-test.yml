spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    properties:
      hibernate:
        globally_quoted_identifiers: true

springdoc:
  swagger-ui:
    enabled: true

cors:
  allowedOrigins: http://localhost:4200

logging:
  level:
    com.backend_project_template: DEBUG

security:
  jwt:
    secret-key: yourSuperSecureSecretKeyWith32Charsandmoreandmorandmore
    expiration-time: 3600000

custom:
  api-url: http://localhost:8080

app:
  init-data: false